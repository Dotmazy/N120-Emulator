name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install Qt and matching compiler
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0 ninja==1.11.1.4
          python -m aqt install-qt windows desktop 6.8.3 win64_mingw -O "$env:RUNNER_TEMP/Qt"
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 -O "$env:RUNNER_TEMP/Qt"
          "$env:RUNNER_TEMP/Qt/Tools/mingw1310_64/bin" >> $env:GITHUB_PATH
          "$env:RUNNER_TEMP/Qt/6.8.3/mingw_64/bin" >> $env:GITHUB_PATH
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.8.3/mingw_64" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake --preset ${{ matrix.configuration }}
      - name: Build
        run: cmake --build --preset ${{ matrix.configuration }} --parallel 2
      - name: Desktop tests without firmware or drivers
        run: ctest --preset ${{ matrix.configuration }}
